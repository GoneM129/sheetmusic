<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sheetmusic</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="sheetmusic-app">
      <div class="card-shadow"></div>
      <div class="card-frame">
        <img
          class="bg-image"
          src="image/e-15-c-630-c-7-fa-6-ec-5523738648-a-2-ea-8259-10.png"
          alt=""
        />
      </div>


      <img class="logo" src="image/_11.png" alt="" />
      <img class="result-panel" src="image/_20.png" alt="" />
      <img class="title-label" src="image/_12.png" alt="" />
      <img class="instruction-label" src="image/_2-10.png" alt="" />
      <img class="finger-icon" src="image/_14.png" alt="" />

      <input
        class="title-input"
        id="songTitle"
        type="text"
        aria-label="곡 제목"
        placeholder=""
        autocomplete="off"
      />

      <img class="input-panel" src="image/_10.png" alt="" />


      <input
        class="file-input"
        id="imageFiles"
        type="file"
        accept="image/*"
        multiple
      />
        
      <button
        class="file-hit-area"
        id="fileButton"
        type="button"
        aria-label="악보 사진 선택"
      ></button>

      <img class="file-button" src="image/_13.png" alt="" />

      <button
        class="merge-button"
        id="mergeButton"
        type="button"
        aria-label="악보 합치기"
      ></button>

      <div class="status" id="status"></div>

      <div class="result-area" id="previewContainer">
        <canvas id="resultCanvas"></canvas>
        <button class="download-button" id="downloadButton" type="button">
          저장하기
        </button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
